name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build dictation.exe
        run: pyinstaller --noconfirm --clean dictation.spec

      - name: Locate built exe and stage it at dist\dictation.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\dictation.exe")) {
            $found = Get-ChildItem -Path . -Filter "dictation.exe" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\dist\\" } | Select-Object -First 1
            if (-not $found) { throw "dictation.exe not found after build" }
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
            Copy-Item $found.FullName "dist\dictation.exe" -Force
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "voiceflow_install.iss"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: Output/VoiceFlow_Dictation_Installer.exe
          generate_release_notes: true
