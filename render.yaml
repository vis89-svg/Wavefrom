services:
  - type: web
    name: opencode
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /global/health
    autoDeploy: true
    envVars:
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_SERVER_USERNAME
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEFAULT_PROVIDER
        sync: false
      - key: DEFAULT_MODEL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GIT_USER_NAME
        sync: false
      - key: GIT_USER_EMAIL
        sync: false
      - key: REPO_URL
        sync: false
